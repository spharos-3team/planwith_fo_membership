spring:
  application:
    name: planwith-fo-membership
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:membership-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${MEMBERSHIP_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8087}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: false
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  gateway:
    public-url: ${GATEWAY_PUBLIC_URL:/}
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-membership-deploy-v1}

membership:
  kafka:
    consumer-enabled: ${MEMBERSHIP_KAFKA_CONSUMER_ENABLED:false}
    topics:
      token-deduction-requested: ${MEMBERSHIP_TOPIC_TOKEN_DEDUCTION_REQUESTED:planwith.token.deduction-requested}
      token-deduction-succeeded: ${MEMBERSHIP_TOPIC_TOKEN_DEDUCTION_SUCCEEDED:planwith.token.deduction-succeeded}
      token-deduction-failed: ${MEMBERSHIP_TOPIC_TOKEN_DEDUCTION_FAILED:planwith.token.deduction-failed}
      payment-completed: ${MEMBERSHIP_TOPIC_PAYMENT_COMPLETED:planwith.payment.completed}
      payment-failed: ${MEMBERSHIP_TOPIC_PAYMENT_FAILED:planwith.payment.failed}
      payment-refunded: ${MEMBERSHIP_TOPIC_PAYMENT_REFUNDED:planwith.payment.refunded}
      membership-subscribed: ${MEMBERSHIP_TOPIC_SUBSCRIBED:planwith.membership.subscribed}
      membership-canceled: ${MEMBERSHIP_TOPIC_CANCELED:planwith.membership.canceled}
      membership-expired: ${MEMBERSHIP_TOPIC_EXPIRED:planwith.membership.expired}
      settlement-requested: ${MEMBERSHIP_TOPIC_SETTLEMENT_REQUESTED:planwith.membership.settlement-requested}
      settlement-completed: ${MEMBERSHIP_TOPIC_SETTLEMENT_COMPLETED:planwith.membership.settlement-completed}
  outbox:
    enabled: ${MEMBERSHIP_OUTBOX_ENABLED:false}
    relay-batch-size: ${MEMBERSHIP_OUTBOX_RELAY_BATCH_SIZE:50}
    relay-interval: ${MEMBERSHIP_OUTBOX_RELAY_INTERVAL:5s}
    relay-initial-delay: ${MEMBERSHIP_OUTBOX_RELAY_INITIAL_DELAY:5s}
    send-timeout: ${MEMBERSHIP_OUTBOX_SEND_TIMEOUT:10s}
    max-retry: ${MEMBERSHIP_OUTBOX_MAX_RETRY:10}
    backoff-initial: ${MEMBERSHIP_OUTBOX_BACKOFF_INITIAL:5s}
    backoff-multiplier: ${MEMBERSHIP_OUTBOX_BACKOFF_MULTIPLIER:2}
    backoff-max: ${MEMBERSHIP_OUTBOX_BACKOFF_MAX:5m}
  cache:
    key-prefix: ${MEMBERSHIP_CACHE_KEY_PREFIX:membership:entitlement}
    ttl: ${MEMBERSHIP_CACHE_TTL:10m}
