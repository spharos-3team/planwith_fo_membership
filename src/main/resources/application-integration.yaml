spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/membership_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:membership_user}
    password: ${DB_PASSWORD:membership_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${MEMBERSHIP_KAFKA_CONSUMER_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8087}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

membership:
  gateway-auth:
    enabled: true
  kafka:
    consumer-enabled: ${MEMBERSHIP_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${MEMBERSHIP_OUTBOX_ENABLED:false}
  expire:
    scheduler-enabled: ${MEMBERSHIP_EXPIRE_SCHEDULER_ENABLED:false}
